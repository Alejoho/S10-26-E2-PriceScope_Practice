name: CI - API Backend

on:
  push:
    branches: [main, backend, feature/estructura-nestjs]
    paths:
      - 'apps/api/**'
      - '.github/workflows/ci-api.yml'
  pull_request:
    branches: [main, backend]
    paths:
      - 'apps/api/**'
      - '.github/workflows/ci-api.yml'

jobs:
  test-and-lint:
    name: Lint & Tests (Backend API)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 18.x / 20.x LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Instalar Dependencias (NestJS)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "Directorio apps/api pendiente de inicialización con NestJS CLI."
          fi

      - name: Verificación de Linter y Formato
        run: |
          if grep -q '"lint"' package.json 2>/dev/null; then
            npm run lint --if-present
          fi

      - name: Ejecución de Tests Unitarios (Jest / NestJS)
        run: |
          if grep -q '"test"' package.json 2>/dev/null; then
            npm run test --if-present
          fi

      - name: Compilación de Producción (Nest Build / tsc)
        run: |
          if grep -q '"build"' package.json 2>/dev/null; then
            npm run build
          fi

